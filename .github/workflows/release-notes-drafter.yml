name: Release Notes Drafter

# Dispatched by release.yml when a GitHub release is published (or run
# manually from the Actions tab with a tag name). It is a separate
# workflow_dispatch workflow because claude-code-action does not
# support the `release` event ("Unsupported event type: release").
#
# Uses claude-code-action to draft a CHANGELOG.md entry for the release
# (following the format documented in CLAUDE.md), then commits the
# result straight to main — no PR, since claude-code-action refuses to
# push to a branch other than the one it was invoked on.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to draft the changelog entry for (e.g. v3.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  draft-changelog:
    name: Draft changelog entry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Draft changelog entry with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A release with tag ${{ inputs.tag_name }} was just published in
            ${{ github.repository }}.

            Do the following:
            1. Run `gh release view ${{ inputs.tag_name }}` to get the
               release's name, description, and published date.
            2. Identify the version and the PRs included in this release from
               the tag, name, and description.
            3. For each PR, read its title/description via `gh pr view` and
               skip internal-only PRs (tests, CI, build tooling, comments,
               dead-code removal, dependency bumps, pure refactors).
            4. For the remaining PRs, read CLAUDE.md in this repo for the
               required changelog format and follow it exactly.
            5. Use the release tag as the version number and the release's
               published date as the entry date.
            6. Read the existing CHANGELOG.md and prepend the new entry at
               the top.
            7. Only edit the file — do not commit, push, or open a PR; a
               later workflow step handles that.
          claude_args: |
            --allowedTools "Read,Edit,Write,Bash(gh pr view:*),Bash(gh release view:*)"
            --max-turns 15

      - name: Commit and push CHANGELOG.md to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet \
            || git commit -m "docs: draft changelog for ${{ inputs.tag_name }} [skip ci]"
          git push origin main
